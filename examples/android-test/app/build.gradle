plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.hxcplayer.test'
    compileSdk 34

    defaultConfig {
        applicationId "com.hxcplayer.test"
        minSdk 24
        targetSdk 29  // 降低到 Android 10 避免 Android 12+ 的 AppOps 严格检查
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 移除 ndk 和 externalNativeBuild，改为依赖 library 模块
    }

    // 签名配置
    signingConfigs {
        release {
            storeFile file('/Users/debug/test.jks')
            storePassword '123456'
            keyAlias 'key0'  // 如果别名不是 key0，请修改
            keyPassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release  // 使用签名配置
        }
        debug {
            signingConfig signingConfigs.release  // Debug 版本也使用签名，方便测试
        }
    }
    
    // Lint 配置：禁用测试版的严格检查
    lintOptions {
        checkReleaseBuilds false
        // 或者只禁用特定的检查
        // disable 'ExpiredTargetSdkVersion'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
    }
    
    // 移除 externalNativeBuild，改为依赖 library 模块
}

dependencies {
    // HXCPlayer 库 - 使用 AAR 文件依赖
    implementation files('libs/hxcplayer-release.aar')
    
    // 如果要切换回源码依赖，注释上面一行，取消注释下面一行：
    // implementation project(':hxcplayer')
    
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
